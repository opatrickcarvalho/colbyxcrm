name: wacrm

services:
  app:
    build:
      context: .
      # NEXT_PUBLIC_* vars are inlined at build time — forward them
      # from .env.local as build args. Changing any of them requires
      # a rebuild (docker compose up --build).
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-}
        NEXT_PUBLIC_APP_LOCALE: ${NEXT_PUBLIC_APP_LOCALE:-en}
    # Runtime (server-only) secrets come from .env.local; they are
    # never baked into the image.
    env_file:
      - .env.local
    # The server always listens on 3000 inside the container. Pinned
    # here because `environment` wins over `env_file`, so a stray PORT
    # in .env.local can't desync the app from the mapping and the
    # healthcheck below.
    environment:
      PORT: 3000
    # Host side only — HOST_PORT=8080 publishes the app on :8080.
    ports:
      - '${HOST_PORT:-3000}:3000'
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3000').then((r)=>process.exit(r.ok||r.status<500?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # Drains automation Wait steps, flows, and scheduled WhatsApp
  # messages. The app itself schedules nothing (see docs/docker.md) —
  # this sidecar is the "external scheduler" those endpoints expect,
  # polling them once a minute over the compose network.
  cron:
    image: alpine:3.20
    depends_on:
      - app
    env_file:
      - .env.local
    environment:
      PORT: 3000
    entrypoint:
      - sh
      - -c
      - |
        set -e
        apk add --no-cache curl >/dev/null
        if [ -z "$$AUTOMATION_CRON_SECRET" ]; then
          echo "cron: AUTOMATION_CRON_SECRET not set, exiting" >&2
          exit 1
        fi
        while true; do
          for path in automations/cron flows/cron whatsapp/scheduled-messages/cron whatsapp/group-broadcasts/cron; do
            curl -fsS -H "x-cron-secret: $$AUTOMATION_CRON_SECRET" \
              "http://app:$$PORT/api/$$path" -o /dev/null \
              || echo "cron: ping failed for $$path" >&2
          done
          sleep 60
        done
    restart: unless-stopped
